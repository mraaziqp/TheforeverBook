<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forever Book | Cinematic Philanthropy</title>
    <style>
      body { background: #020617; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
      .loader { display: flex; flex-direction: column; align-items: center; gap: 20px; }
      .spinner { width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
      .text { color: rgba(255,255,255,0.4); font-size: 10px; text-transform: uppercase; letter-spacing: 0.3em; font-weight: bold; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader">
        <div class="spinner"></div>
        <div class="text">Initialising Studio</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
